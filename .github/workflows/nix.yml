# Builds the Nix package (x86_64-linux and aarch64-darwin), runs its install
# check, and publishes the results to the attic cache for trusted events only.
#
#   pull_request            `build`: build + install check. No secret, no
#                           Tailscale and no attic cache for any pull request,
#                           from a fork or from this repository: the code of a
#                           pull request (ci/*.sh, flake.nix) is not trusted
#                           with the credentials that write to the cache. It
#                           uses the public substituters only.
#                           `build-darwin` builds the same on macos-15 (aarch64-darwin)
#                           with cache.nixos.org as the only substituter; it uses
#                           no secret and no environment either. It also dry-runs
#                           ci/push-attic.sh with a stub client, and
#                           `verify-darwin-rehearsal` runs the checks of
#                           `verify-cache-darwin` against a local cache that
#                           stands in for attic.
#   workflow_dispatch       `build`; never publishes.
#   push to main, v* tag    `publish`: build + install check, then push the
#                           closures to attic; `verify-cache` then substitutes
#                           them from attic and cache.nixos.org into an empty
#                           store. Only these
#                           two jobs use the GitHub environment `attic-publish`
#                           (its secrets TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET and
#                           ATTIC_TOKEN), and the environment's deployment
#                           branch/tag rules should allow `main` and `v*` only.
#                           `publish-darwin` and `verify-cache-darwin` do the same
#                           for aarch64-darwin on macos-15. They depend on each
#                           other only, never on the Linux jobs, and the Linux
#                           jobs do not wait for them; they use the same
#                           environment and secrets.
#
# `publish` runs only Nix builds and the push: no script of the repository
# touches the credentials outside the Nix sandbox, except ci/push-attic.sh,
# which runs from a commit that is already on main or tagged. Without the
# secrets `publish` still builds and checks; it just skips Tailscale, the cache
# and the push, and `verify-cache` is skipped.
name: Nix

on:
  pull_request:
    # No branch filter: a pull request stacked on another branch is built too.
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # A push to main or a tag must finish: it publishes to the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Pull requests and manual runs: nothing here reads a secret except the
  # read-only GITHUB_TOKEN, which only raises the GitHub API rate limit.
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Build steps are capped at 90 minutes.
    timeout-minutes: 160
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # No `nix flake check --no-build` here: fenix reads the channel manifest
      # (import from derivation), which cannot be fetched with --no-build on a
      # store that does not have it yet. The builds evaluate the flake anyway.
      - name: Build the dependencies
        timeout-minutes: 90
        run: nix build -L .#cargo-deps --out-link result-deps
      # The package's install check runs in the Nix sandbox as part of this
      # build: version, a minimal offline build, linked libraries, no
      # self-update.
      - name: Build and check the package
        timeout-minutes: 90
        run: nix build -L .#cargo --out-link result-cargo
      - name: Check the installed copy outside the sandbox
        timeout-minutes: 10
        run: |
          ./result-cargo/bin/cargo -V | tee version.txt
          grep -F "turtton/cargo $(cat TURTTON_VERSION)," version.txt
          bash ci/smoke-installed.sh "$PWD/result-cargo/bin/cargo"
      - name: Build the smoke check
        timeout-minutes: 30
        run: nix build -L .#checks.x86_64-linux.smoke --no-link
      # Built on every event so that a change to its patch is caught in the
      # pull request, not after the merge.
      - name: Build the patched attic client
        timeout-minutes: 90
        run: nix build -L .#attic-client --out-link result-attic

  # aarch64-darwin, pull requests and manual runs: the same builds as `build`
  # on a macOS runner, in the Nix sandbox, with cache.nixos.org as the only
  # substituter. No repository secret, no environment, no Tailscale and no
  # attic cache; the flake's nixConfig (the attic cache) is not accepted. The
  # token passed to Nix is the automatic read-only one, which only raises the
  # GitHub API rate limit for fetching the flake inputs.
  #
  # Besides building, the job records the runner and timings, the linkage of
  # the binary, and rehearses `verify-cache`'s signature checks against
  # cache.nixos.org (nix/darwin-ci-*.sh).
  build-darwin:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          # The sandbox is asked for explicitly: Nix's default on macOS is off.
          # Only cache.nixos.org substitutes, and the flake's own nixConfig
          # is not accepted (accept-flake-config stays off).
          extra_nix_config: |
            sandbox = true
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            accept-flake-config = false
      - name: Record the runner and the Nix configuration
        timeout-minutes: 10
        run: nix/darwin-ci-environment.sh
      - name: The Nix sandbox is on
        timeout-minutes: 10
        run: nix/darwin-ci-sandbox-probe.sh
      # The checks of verify-cache that do not need attic, before the long builds.
      - name: Rehearse the signature checks of verify-cache with cache.nixos.org
        timeout-minutes: 15
        # The tools are the ones of the nixpkgs revision in flake.lock, not the
        # runner's bash 3.2 and BSD tools.
        run: nix/run-pinned.sh nix/darwin-ci-verify.sh
      # The helpers of the publish and verify scripts must fail when a query
      # behind a check fails (nix/darwin-ci-lib-test.sh uses shims).
      - name: Test that the verify helpers fail when a query fails
        timeout-minutes: 10
        run: nix/run-pinned.sh nix/darwin-ci-lib-test.sh
      - name: Build the dependencies
        timeout-minutes: 120
        run: |
          start=$SECONDS
          nix build -L --option sandbox true .#cargo-deps --out-link result-deps 2>&1 | tee build-deps.log
          echo "deps: $((SECONDS - start)) s" | tee -a "$RUNNER_TEMP/times.txt"
      # The package's install check runs in the Nix sandbox as part of this
      # build: version, a minimal offline build and the Mach-O check; it prints
      # otool's output before it judges. It has no no-self-update check on
      # Darwin: that updater smoke needs listeners, which only checks.smoke
      # (built below) may use.
      - name: Build and check the package
        timeout-minutes: 120
        run: |
          start=$SECONDS
          nix build -L --option sandbox true .#cargo --out-link result-cargo 2>&1 | tee build-cargo.log
          echo "cargo (with the install check): $((SECONDS - start)) s" | tee -a "$RUNNER_TEMP/times.txt"
      - name: Record the linkage, references and closure of the package
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: nix/darwin-ci-linkage.sh result-cargo result-deps
      - name: Check the installed copy outside the sandbox
        timeout-minutes: 10
        run: |
          ./result-cargo/bin/cargo -V | tee version.txt
          grep -F "turtton/cargo $(cat TURTTON_VERSION)," version.txt
          bash ci/smoke-installed.sh "$PWD/result-cargo/bin/cargo"
      # Fixtures with paths the check must reject, and the closure of the
      # package; both depend on the package build only through the closure.
      - name: Build the Mach-O check fixtures
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          start=$SECONDS
          nix build -L --option sandbox true .#checks.aarch64-darwin.macho-inspection --no-link 2>&1 | tee build-macho-inspection.log
          echo "macho-inspection: $((SECONDS - start)) s" | tee -a "$RUNNER_TEMP/times.txt"
      - name: Build the smoke check and the closure check
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          start=$SECONDS
          nix build -L --option sandbox true .#checks.aarch64-darwin.smoke .#checks.aarch64-darwin.closure --no-link 2>&1 | tee build-checks.log
          echo "smoke and closure: $((SECONDS - start)) s" | tee -a "$RUNNER_TEMP/times.txt"
      - name: HTTPS with the built cargo (outside the Nix sandbox, verification on)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: nix/darwin-ci-https.sh result-cargo/bin/cargo
      # What publish-darwin does after its builds, up to the network: the data it
      # hands to verify-cache-darwin, and ci/push-attic.sh with a stub client.
      - name: Build the Mach-O allow lists
        timeout-minutes: 10
        run: nix build -L --option sandbox true .#checks.aarch64-darwin.macho-config --out-link result-macho 2>&1 | tee build-macho-config.log
      - name: Dry-run ci/push-attic.sh with a stub attic client
        timeout-minutes: 15
        run: nix/run-pinned.sh nix/darwin-ci-push-dryrun.sh ./result-cargo ./result-deps
      # The paths of the closures that cache.nixos.org does not have, as a signed
      # binary cache, for verify-darwin-rehearsal on a fresh runner (this job's
      # store has them all, which the daemon step of the verify script forbids).
      - name: Export what attic would hold, signed with a key of this run
        timeout-minutes: 30
        run: nix/run-pinned.sh nix/darwin-ci-rehearsal-export.sh ./result-cargo ./result-deps ./result-macho "$RUNNER_TEMP/rehearsal"
      - name: Upload the rehearsal cache
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: darwin-rehearsal-cache
          path: ${{ runner.temp }}/rehearsal
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: No setting was ignored
        if: ${{ !cancelled() }}
        run: |
          # A setting of ours that the daemon ignored (e.g. the sandbox) fails.
          if grep -Ei 'ignoring the (client|user)-specified setting' build-*.log; then
            echo "::error::Nix ignored a setting"
            exit 1
          fi
          # The flake's own nixConfig (the attic cache) must have been refused.
          grep -h 'ignoring untrusted flake configuration setting' build-*.log | sort -u
      - name: Timings
        if: ${{ !cancelled() }}
        run: |
          cat "$RUNNER_TEMP/times.txt"
          echo "== memory and disk after the builds"
          vm_stat | head -8
          top -l 1 -n 0 2>/dev/null | grep PhysMem || true
          {
            echo "### build-darwin: build times"
            echo '```'
            cat "$RUNNER_TEMP/times.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / /nix || true

  # Pull requests and manual runs: the checks of verify-cache-darwin, run for
  # real against a local cache that stands in for attic, on a fresh runner whose
  # Nix store has none of the paths. build-darwin made the cache (the paths of
  # the two closures that cache.nixos.org does not have, signed with a key of
  # that run) and the data publish-darwin would hand over. No secret: the
  # credential is a made-up token, and the cache is on 127.0.0.1. What this
  # cannot show is the network to attic and the real credential, which only
  # verify-cache-darwin on main can.
  verify-darwin-rehearsal:
    needs: build-darwin
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            sandbox = true
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            accept-flake-config = false
      - name: Download the rehearsal cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: darwin-rehearsal-cache
          path: ${{ runner.temp }}/rehearsal
      - name: Verify the cache the way verify-cache-darwin does
        timeout-minutes: 40
        env:
          PINNED_EXTRA_PACKAGES: python3
        run: nix/run-pinned.sh nix/darwin-ci-rehearsal.sh "$RUNNER_TEMP/rehearsal"

  # Main and v* tags only: the code is already merged or tagged. This job
  # builds, checks (inside the Nix sandbox only) and pushes; it never executes
  # a repository script outside the sandbox other than the push script.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    # Build steps are capped at 90 minutes and the attic push at 60.
    timeout-minutes: 160
    environment: attic-publish
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.record.outputs.pushed }}
      release: ${{ steps.record.outputs.release }}
      cargo: ${{ steps.record.outputs.cargo }}
      cargo-deps: ${{ steps.record.outputs.cargo-deps }}
      attic-client: ${{ steps.record.outputs.attic-client }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Tag matches TURTTON_VERSION
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(cat TURTTON_VERSION)"
      - name: Decide whether the attic cache can be used
        id: gate
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ] && [ -n "$ATTIC_TOKEN" ]; then
            echo "attic=true" >> "$GITHUB_OUTPUT"
          else
            echo "attic=false" >> "$GITHUB_OUTPUT"
            echo "::notice::attic cache not used (secrets of the attic-publish environment are not set)"
          fi
      - name: Connect to Tailscale
        if: steps.gate.outputs.attic == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up the attic client and cache
        if: steps.gate.outputs.attic == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          # nixpkgs' client is in cache.nixos.org; the patched one below needs
          # a build unless attic has it already.
          nix run --inputs-from . nixpkgs#attic-client -- login --set-default home https://attic.taile2777.ts.net "$ATTIC_TOKEN"
          nix run --inputs-from . nixpkgs#attic-client -- use home
      # No `nix flake check --no-build` here: see the build job.
      - name: Build the dependencies
        timeout-minutes: 90
        run: nix build -L .#cargo-deps --out-link result-deps
      # The package's install check runs in the Nix sandbox as part of this
      # build: version, a minimal offline build, linked libraries, no
      # self-update.
      - name: Build and check the package
        timeout-minutes: 90
        run: nix build -L .#cargo --out-link result-cargo
      # The finished store path, run read-only in the Nix sandbox.
      - name: Build the smoke check
        timeout-minutes: 30
        run: nix build -L .#checks.x86_64-linux.smoke --no-link
      - name: Build the patched attic client
        timeout-minutes: 90
        run: nix build -L .#attic-client --out-link result-attic
      - name: Push to attic
        id: push
        if: steps.gate.outputs.attic == 'true'
        timeout-minutes: 60
        run: |
          # How the runner reaches attic (direct or DERP relay) bounds throughput.
          timeout 60 sudo tailscale ping -c 3 attic.taile2777.ts.net || true
          # The leading ./ keeps the links from being read as flake references.
          ci/push-attic.sh ./result-attic ./result-cargo ./result-deps
      # What verify-cache must find in attic: the roots of the pushed closures.
      - name: Record the push
        id: record
        env:
          PUSHED: ${{ steps.push.outcome == 'success' }}
        run: |
          {
            echo "pushed=$PUSHED"
            echo "release=$(cat TURTTON_VERSION)"
            echo "cargo=$(readlink -f result-cargo)"
            echo "cargo-deps=$(readlink -f result-deps)"
            echo "attic-client=$(readlink -f result-attic)"
          } >> "$GITHUB_OUTPUT"

  # Fetches what `publish` pushed into an empty store of another location than
  # the one Nix itself runs from: the runner's own store holds only Nix (from
  # cache.nixos.org) and takes no part in the check. Substitution may use attic
  # and cache.nixos.org and nothing else (the flake is never consulted), the
  # way a user of the flake gets the package.
  #
  # cache.nixos.org is needed because the attic client skips every path that
  # carries a signature of an upstream cache (the cache's
  # upstream_cache_key_names, cache.nixos.org-1): glibc and the other nixpkgs
  # paths of the closure are not in attic, and `nix copy --from attic` of the
  # closure fails on the first of them ("path '...-glibc-...' is not valid").
  # What attic must serve is everything else: the paths cache.nixos.org does
  # not have (the package, its dependencies, the patched attic client). The
  # job checks those one by one. The negative steps show that a missing path
  # fails.
  verify-cache:
    needs: publish
    if: needs.publish.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: attic-publish
    permissions: {}
    env:
      # The same cache and key as nixConfig in flake.nix.
      ATTIC_URL: https://attic.taile2777.ts.net/home
      ATTIC_HOST: attic.taile2777.ts.net
      ATTIC_KEY: home:00byWMpTTw/3xTntv8EF6LQmlWlR9RU5Tl0GVG5Vwn8=
      # The upstream cache and its public key (the default of every Nix).
      UPSTREAM_URL: https://cache.nixos.org
      UPSTREAM_KEY: cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Substitute the closures from attic and cache.nixos.org into an empty store
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CARGO_OUT: ${{ needs.publish.outputs.cargo }}
          DEPS_OUT: ${{ needs.publish.outputs.cargo-deps }}
          ATTIC_CLIENT_OUT: ${{ needs.publish.outputs.attic-client }}
        run: |
          store="$RUNNER_TEMP/verify-store"
          roots=("$CARGO_OUT" "$DEPS_OUT" "$ATTIC_CLIENT_OUT")
          for p in "${roots[@]}"; do
            [[ "$p" =~ ^/nix/store/[0-9a-df-np-sv-z]{32}-[A-Za-z0-9+._?=-]+$ ]] \
              || { echo "unexpected store path: $p" >&2; exit 1; }
          done
          # The token is only in this file, read by this job's nix commands.
          (umask 077; printf 'machine %s password %s\n' "$ATTIC_HOST" "$ATTIC_TOKEN" > "$RUNNER_TEMP/netrc")
          mkdir -p "$store"
          nixopts=(
            --option netrc-file "$RUNNER_TEMP/netrc"
            --option trusted-public-keys "$ATTIC_KEY $UPSTREAM_KEY"
            --option substituters "$ATTIC_URL $UPSTREAM_URL"
          )

          echo "== the verify store starts empty"
          test "$(nix path-info --all --store "local?root=$store" | wc -l)" -eq 0

          # The log names the cache of every path. The store has no derivation,
          # so a path that neither cache serves cannot be built instead.
          echo "== substitute the closures from attic and cache.nixos.org only"
          nix build -L --no-link --store "local?root=$store" "${nixopts[@]}" "${roots[@]}"

          echo "== every path of the closures is there and its content is intact"
          nix path-info --store "local?root=$store" --recursive "${roots[@]}" | tee closure.txt
          wc -l < closure.txt
          while read -r p; do
            test -e "$store$p" || { echo "missing from the verify store: $p" >&2; exit 1; }
          done < closure.txt
          nix store verify --store "local?root=$store" --no-trust --recursive "${roots[@]}"
          # Nothing but those closures was put there.
          test "$(nix path-info --all --store "local?root=$store" | sort | wc -l)" -eq "$(sort -u closure.txt | wc -l)"

          # Substituting from both caches cannot tell where a path came from.
          # What cache.nixos.org does not have only attic can have served, and
          # attic must have each of those paths.
          echo "== which paths of the closures cache.nixos.org has"
          # Asks for the narinfo itself. `nix path-info` says "is not valid" for
          # an HTTP 401/403 as well as for a 404, so only the status can tell
          # a path the cache does not have from a query that failed. Only a
          # 404 means "not there"; a 200 must be the narinfo of this very path;
          # every other answer (403, 5xx, no connection) is an error.
          probe_upstream() {
            local path="$1" name hash body code err
            name="${path#/nix/store/}"
            hash="${name%%-*}"
            body="$(mktemp "$RUNNER_TEMP/narinfo.XXXXXX")"
            if ! code="$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              -o "$body" -w '%{http_code}' "$UPSTREAM_URL/$hash.narinfo" 2>"$body.err")"; then
              err="$(tr '\n' ' ' < "$body.err")"
              printf 'error %s: %s\n' "$path" "$err"
            elif [ "$code" = 404 ]; then
              printf 'fork %s\n' "$path"
            elif [ "$code" = 200 ] && grep -qxF "StorePath: $path" "$body"; then
              printf 'upstream %s\n' "$path"
            else
              printf 'error %s: HTTP %s from %s/%s.narinfo\n' "$path" "$code" "$UPSTREAM_URL" "$hash"
            fi
            rm -f "$body" "$body.err"
          }
          export -f probe_upstream
          export UPSTREAM_URL
          # The inner shell expands $1, not this one.
          # shellcheck disable=SC2016
          sort -u closure.txt | xargs -P 16 -I{} bash -c 'probe_upstream "$1"' _ {} > classified.txt
          if grep -q '^error ' classified.txt; then
            grep '^error ' classified.txt >&2
            echo "::error::could not ask $UPSTREAM_URL about every path"
            exit 1
          fi
          echo "cache.nixos.org has $(grep -c '^upstream ' classified.txt) paths"
          echo "only attic can have $(grep -c '^fork ' classified.txt) paths:"
          sed -n 's/^fork //p' classified.txt | sort | tee fork.txt
          # The roots are built by this repository and are in no other cache.
          for p in "${roots[@]}"; do
            grep -qxF "$p" fork.txt || { echo "::error::$p is in $UPSTREAM_URL" >&2; exit 1; }
          done
          echo "== attic has every one of them"
          mapfile -t fork < fork.txt
          nix path-info --store "$ATTIC_URL" --option netrc-file "$RUNNER_TEMP/netrc" "${fork[@]}" > /dev/null
      # A check that cannot fail proves nothing. Each path below must fail to
      # be fetched, with the same commands as above (the substitution of both
      # caches, and attic alone):
      #   - a path that neither cache has: the substitution above must not be
      #     able to succeed on a path that is not there;
      #   - a path that only cache.nixos.org has (glibc, from the closure just
      #     checked): attic alone must not serve it. This is what the attic
      #     client's skipping of upstream paths means, and why the check above
      #     needs cache.nixos.org at all.
      - name: A path that is missing fails
        run: |
          attic_opts=(--option netrc-file "$RUNNER_TEMP/netrc" --option trusted-public-keys "$ATTIC_KEY" --option substituters "$ATTIC_URL")
          both_opts=(
            --option netrc-file "$RUNNER_TEMP/netrc"
            --option trusted-public-keys "$ATTIC_KEY $UPSTREAM_KEY"
            --option substituters "$ATTIC_URL $UPSTREAM_URL"
          )
          fail_to_copy() {
            local store="$RUNNER_TEMP/negative-store-$1"
            mkdir -p "$store"
            if nix copy --from "$ATTIC_URL" --to "local?root=$store" "${attic_opts[@]}" "$2"; then
              echo "::error::attic served $2, which it must not have"
              exit 1
            fi
            echo "as expected, attic does not serve $2"
          }
          fail_to_substitute() {
            local store="$RUNNER_TEMP/negative-store-$1"
            mkdir -p "$store"
            if nix build --no-link --store "local?root=$store" "${both_opts[@]}" "$2"; then
              echo "::error::a substituter served $2, which it must not have"
              exit 1
            fi
            echo "as expected, neither cache serves $2"
          }
          fake=/nix/store/00000000000000000000000000000000-turtton-cargo-missing
          echo "== a store path with a made-up hash, from attic alone"
          fail_to_copy fake "$fake"
          echo "== the same path, from attic and cache.nixos.org"
          fail_to_substitute fake-both "$fake"
          echo "== a path of cache.nixos.org that attic does not have (the glibc of the closure)"
          glibc="$(sed -n 's/^upstream //p' classified.txt | grep -E -- '-glibc-[0-9][0-9.-]*$' | sort | head -n 1)"
          test -n "$glibc" || { echo "::error::no upstream glibc in the closure" >&2; exit 1; }
          fail_to_copy glibc "$glibc"
      - name: Remove the attic credential
        if: always()
        run: rm -f "$RUNNER_TEMP/netrc"
      # chroot, because the store sits under $RUNNER_TEMP while its paths are
      # absolute /nix/store paths; no secret is present from here on.
      - name: Run the substituted package
        env:
          CARGO_OUT: ${{ needs.publish.outputs.cargo }}
          RELEASE: ${{ needs.publish.outputs.release }}
        run: |
          store="$RUNNER_TEMP/verify-store"
          mkdir -p "$store/tmp/home/.cargo"
          chmod 700 "$store/tmp/home" "$store/tmp/home/.cargo"
          sudo env -i HOME=/tmp/home CARGO_HOME=/tmp/home/.cargo chroot "$store" "$CARGO_OUT/bin/cargo" -V | tee version.txt
          grep -F "turtton/cargo $RELEASE," version.txt
          ! grep -q huacnlee version.txt

  # aarch64-darwin, main and v* tags only: what `publish` does on x86_64-linux,
  # on macos-15, and independent of it (a failure of one does not stop the
  # other, and the Linux jobs do not wait for this one). The builds run in the
  # Nix sandbox with cache.nixos.org as the only substituter, and finish before
  # Tailscale and the credential are put on the runner; the credential is read
  # only by the steps that set up the attic client. The roots are cargo and
  # cargo-deps. The unpatched attic client of the pinned nixpkgs is used (the
  # TCP_USER_TIMEOUT patch is for Linux, where reqwest has that option).
  #
  # What it hands to verify-cache-darwin, as separate outputs of this system:
  # the system, the commit, the release, the absolute store paths of the roots,
  # the other paths of cargo's closure that the Mach-O check allows, the
  # deployment target and the allow lists of nix/check-macho.sh.
  publish-darwin:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: macos-15
    # Build steps are capped at 120 minutes and the attic push at 60.
    timeout-minutes: 240
    environment: attic-publish
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.record.outputs.pushed }}
      system: ${{ steps.handover.outputs.system }}
      commit: ${{ steps.handover.outputs.commit }}
      release: ${{ steps.handover.outputs.release }}
      cargo: ${{ steps.handover.outputs.cargo }}
      cargo-deps: ${{ steps.handover.outputs.cargo-deps }}
      allowed: ${{ steps.handover.outputs.allowed }}
      deployment-target: ${{ steps.handover.outputs.deployment-target }}
      macho: ${{ steps.handover.outputs.macho }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Tag matches TURTTON_VERSION
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(cat TURTTON_VERSION)"
      - name: Decide whether the attic cache can be used
        id: gate
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ] && [ -n "$ATTIC_TOKEN" ]; then
            echo "attic=true" >> "$GITHUB_OUTPUT"
          else
            echo "attic=false" >> "$GITHUB_OUTPUT"
            echo "::notice::attic cache not used (secrets of the attic-publish environment are not set)"
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # As in build-darwin: the sandbox is asked for explicitly, only
          # cache.nixos.org substitutes and the flake's nixConfig (the attic
          # cache) is not accepted. Attic is not a substituter of this job.
          extra_nix_config: |
            sandbox = true
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            accept-flake-config = false
      - name: Record the runner and the Nix configuration
        timeout-minutes: 10
        run: nix/darwin-ci-environment.sh
      - name: The Nix sandbox is on
        timeout-minutes: 10
        run: nix/darwin-ci-sandbox-probe.sh
      # No `nix flake check --no-build` here: see the build job.
      - name: Build the dependencies
        timeout-minutes: 120
        run: nix build -L --option sandbox true .#cargo-deps --out-link result-deps
      # The package's install check runs in the Nix sandbox as part of this
      # build: version, a minimal offline build and the Mach-O check.
      - name: Build and check the package
        timeout-minutes: 120
        run: nix build -L --option sandbox true .#cargo --out-link result-cargo
      # The fixtures the Mach-O check must reject, the finished store path run
      # read-only in the Nix sandbox (the updater smoke, which may listen on
      # 127.0.0.1), the closure of the package and the allow lists.
      - name: Build the smoke, closure and Mach-O checks
        timeout-minutes: 30
        run: |
          nix build -L --option sandbox true \
            .#checks.aarch64-darwin.macho-inspection \
            .#checks.aarch64-darwin.smoke \
            .#checks.aarch64-darwin.closure --no-link
          nix build -L --option sandbox true .#checks.aarch64-darwin.macho-config --out-link result-macho
      - name: Build the attic client of the pinned nixpkgs
        timeout-minutes: 60
        run: |
          rev="$(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.rev')"
          nix build -L --option sandbox true --out-link result-attic "github:NixOS/nixpkgs/$rev#attic-client"
          ./result-attic/bin/attic --version
      # Checked before the credential is on the runner. The outputs are written
      # here and are valid whether or not the push happens (`pushed` says).
      - name: Hand over the commit, the release and the store paths
        id: handover
        timeout-minutes: 10
        run: |
          HANDOVER_GITHUB_OUTPUT="$GITHUB_OUTPUT" nix/run-pinned.sh nix/darwin-ci-handover.sh ./result-cargo ./result-deps ./result-macho | tee handover.json
      - name: Connect to Tailscale
        if: steps.gate.outputs.attic == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      # DNS, routing, TLS (the certificate is checked, nothing is disabled) and
      # the credential, before the long push. The client keeps its login in
      # the runner's home for the push.
      - name: Check that attic is reachable and accepts the credential
        if: steps.gate.outputs.attic == 'true'
        timeout-minutes: 10
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          host=attic.taile2777.ts.net
          echo "== tailscale"
          tailscale status || true
          sudo -n tailscale ping -c 3 "$host" || true
          echo "== DNS, route and TLS: an HTTPS request with verification on"
          status=0
          curl -sS -o /dev/null --max-time 30 \
            -w 'HTTP %{http_code} from %{remote_ip}, certificate verification %{ssl_verify_result}\n' \
            "https://$host/" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::https://$host/ is not reachable (curl exit $status: 6 DNS, 7 connect, 28 timeout, 35/51/60 TLS)"
            scutil --dns | head -40 || true
            exit 1
          fi
          echo "== the credential"
          ./result-attic/bin/attic login --set-default home "https://$host" "$ATTIC_TOKEN"
          ./result-attic/bin/attic cache info home | tee cache-info.txt
          # The key that flake.nix and the verify jobs trust.
          key="$(sed -n 's/.*"\(home:[^"]*\)".*/\1/p' flake.nix | head -n 1)"
          # An empty key would match anything.
          [[ "$key" =~ ^home:[A-Za-z0-9+/]+=*$ ]] || { echo "::error::no public key of the cache in flake.nix: '$key'"; exit 1; }
          grep -qF "$key" cache-info.txt || echo "::warning::the public key of the cache is not $key"
      - name: Push to attic
        id: push
        if: steps.gate.outputs.attic == 'true'
        timeout-minutes: 60
        run: |
          # How the runner reaches attic (direct or DERP relay) bounds throughput.
          sudo -n tailscale ping -c 3 attic.taile2777.ts.net || true
          # readlink -e and timeout --kill-after are the GNU ones of the pinned
          # nixpkgs. The leading ./ keeps the links from being read as flake
          # references. The roots are cargo and cargo-deps only.
          ATTIC_BIN="$PWD/result-attic/bin/attic" nix/run-pinned.sh ci/push-attic.sh ./result-cargo ./result-deps
      - name: Record the push
        id: record
        env:
          PUSHED: ${{ steps.push.outcome == 'success' }}
        run: echo "pushed=$PUSHED" >> "$GITHUB_OUTPUT"

  # Fetches what `publish-darwin` pushed into an empty store, on another macOS
  # runner (a new one, nothing restored: its Nix store has none of the paths),
  # the way a user of the flake gets the package, and runs it. The steps are in
  # nix/darwin-ci-verify-cache.sh; verify-darwin-rehearsal runs the same script
  # against a local cache in every pull request. Substitution may use attic and
  # cache.nixos.org and nothing else (the flake is never consulted), each trusted
  # by its own key. The netrc file with the credential exists only between the
  # fetch step and the step that removes it; the daemon step runs without it.
  verify-cache-darwin:
    needs: publish-darwin
    if: needs.publish-darwin.outputs.pushed == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: attic-publish
    permissions:
      contents: read
    env:
      # The same cache and key as nixConfig in flake.nix.
      ATTIC_URL: https://attic.taile2777.ts.net/home
      ATTIC_HOST: attic.taile2777.ts.net
      ATTIC_KEY: home:00byWMpTTw/3xTntv8EF6LQmlWlR9RU5Tl0GVG5Vwn8=
      # The upstream cache and its public key (the default of every Nix).
      UPSTREAM_URL: https://cache.nixos.org
      UPSTREAM_KEY: cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      # What publish-darwin handed over.
      VC_SYSTEM: ${{ needs.publish-darwin.outputs.system }}
      VC_COMMIT: ${{ needs.publish-darwin.outputs.commit }}
      VC_RELEASE: ${{ needs.publish-darwin.outputs.release }}
      VC_CARGO: ${{ needs.publish-darwin.outputs.cargo }}
      VC_DEPS: ${{ needs.publish-darwin.outputs.cargo-deps }}
      VC_ALLOWED: ${{ needs.publish-darwin.outputs.allowed }}
      VC_MINOS: ${{ needs.publish-darwin.outputs.deployment-target }}
      VC_MACHO: ${{ needs.publish-darwin.outputs.macho }}
    steps:
      # The scripts of the commit that was published.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ needs.publish-darwin.outputs.commit }}
          persist-credentials: false
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            sandbox = true
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            accept-flake-config = false
      - name: Check what publish-darwin handed over
        run: nix/run-pinned.sh nix/darwin-ci-verify-cache.sh handover
      - name: Substitute the closures from attic and cache.nixos.org into an empty store
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: nix/run-pinned.sh nix/darwin-ci-verify-cache.sh fetch
      - name: Remove the attic credential
        if: always()
        run: rm -f "$RUNNER_TEMP/verify-cache/netrc"
      # No secret is present from here on.
      - name: Copy to the daemon, run the package and check it again
        run: nix/run-pinned.sh nix/darwin-ci-verify-cache.sh daemon

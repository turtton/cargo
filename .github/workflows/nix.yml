# Builds the Nix package (x86_64-linux), runs its install check, and publishes
# the result to the attic cache for trusted events only.
#
#   pull_request            `build`: build + install check. No secret, no
#                           Tailscale and no attic cache for any pull request,
#                           from a fork or from this repository: the code of a
#                           pull request (ci/*.sh, flake.nix) is not trusted
#                           with the credentials that write to the cache. It
#                           uses the public substituters only.
#   workflow_dispatch       `build`; never publishes.
#   push to main, v* tag    `publish`: build + install check, then push the
#                           closures to attic; `verify-cache` then fetches them
#                           from attic alone into an empty store. Only these
#                           two jobs use the GitHub environment `attic-publish`
#                           (its secrets TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET and
#                           ATTIC_TOKEN), and the environment's deployment
#                           branch/tag rules should allow `main` and `v*` only.
#
# `publish` runs only Nix builds and the push: no script of the repository
# touches the credentials outside the Nix sandbox, except ci/push-attic.sh,
# which runs from a commit that is already on main or tagged. Without the
# secrets `publish` still builds and checks; it just skips Tailscale, the cache
# and the push, and `verify-cache` is skipped.
name: Nix

on:
  pull_request:
    # No branch filter: a pull request stacked on another branch is built too.
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # A push to main or a tag must finish: it publishes to the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Pull requests and manual runs: nothing here reads a secret except the
  # read-only GITHUB_TOKEN, which only raises the GitHub API rate limit.
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Build steps are capped at 90 minutes.
    timeout-minutes: 160
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # No `nix flake check --no-build` here: fenix reads the channel manifest
      # (import from derivation), which cannot be fetched with --no-build on a
      # store that does not have it yet. The builds evaluate the flake anyway.
      - name: Build the dependencies
        timeout-minutes: 90
        run: nix build -L .#cargo-deps --out-link result-deps
      # The package's install check runs in the Nix sandbox as part of this
      # build: version, a minimal offline build, linked libraries, no
      # self-update.
      - name: Build and check the package
        timeout-minutes: 90
        run: nix build -L .#cargo --out-link result-cargo
      - name: Check the installed copy outside the sandbox
        timeout-minutes: 10
        run: |
          ./result-cargo/bin/cargo -V | tee version.txt
          grep -F "turtton/cargo $(cat TURTTON_VERSION)," version.txt
          bash ci/smoke-installed.sh "$PWD/result-cargo/bin/cargo"
      - name: Build the smoke check
        timeout-minutes: 30
        run: nix build -L .#checks.x86_64-linux.smoke --no-link
      # Built on every event so that a change to its patch is caught in the
      # pull request, not after the merge.
      - name: Build the patched attic client
        timeout-minutes: 90
        run: nix build -L .#attic-client --out-link result-attic

  # Main and v* tags only: the code is already merged or tagged. This job
  # builds, checks (inside the Nix sandbox only) and pushes; it never executes
  # a repository script outside the sandbox other than the push script.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    # Build steps are capped at 90 minutes and the attic push at 60.
    timeout-minutes: 160
    environment: attic-publish
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.record.outputs.pushed }}
      release: ${{ steps.record.outputs.release }}
      cargo: ${{ steps.record.outputs.cargo }}
      cargo-deps: ${{ steps.record.outputs.cargo-deps }}
      attic-client: ${{ steps.record.outputs.attic-client }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Tag matches TURTTON_VERSION
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(cat TURTTON_VERSION)"
      - name: Decide whether the attic cache can be used
        id: gate
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ] && [ -n "$ATTIC_TOKEN" ]; then
            echo "attic=true" >> "$GITHUB_OUTPUT"
          else
            echo "attic=false" >> "$GITHUB_OUTPUT"
            echo "::notice::attic cache not used (secrets of the attic-publish environment are not set)"
          fi
      - name: Connect to Tailscale
        if: steps.gate.outputs.attic == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up the attic client and cache
        if: steps.gate.outputs.attic == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          # nixpkgs' client is in cache.nixos.org; the patched one below needs
          # a build unless attic has it already.
          nix run --inputs-from . nixpkgs#attic-client -- login --set-default home https://attic.taile2777.ts.net "$ATTIC_TOKEN"
          nix run --inputs-from . nixpkgs#attic-client -- use home
      # No `nix flake check --no-build` here: see the build job.
      - name: Build the dependencies
        timeout-minutes: 90
        run: nix build -L .#cargo-deps --out-link result-deps
      # The package's install check runs in the Nix sandbox as part of this
      # build: version, a minimal offline build, linked libraries, no
      # self-update.
      - name: Build and check the package
        timeout-minutes: 90
        run: nix build -L .#cargo --out-link result-cargo
      # The finished store path, run read-only in the Nix sandbox.
      - name: Build the smoke check
        timeout-minutes: 30
        run: nix build -L .#checks.x86_64-linux.smoke --no-link
      - name: Build the patched attic client
        timeout-minutes: 90
        run: nix build -L .#attic-client --out-link result-attic
      - name: Push to attic
        id: push
        if: steps.gate.outputs.attic == 'true'
        timeout-minutes: 60
        run: |
          # How the runner reaches attic (direct or DERP relay) bounds throughput.
          timeout 60 sudo tailscale ping -c 3 attic.taile2777.ts.net || true
          ci/push-attic.sh result-attic result-cargo result-deps
      # What verify-cache must find in attic: the roots of the pushed closures.
      - name: Record the push
        id: record
        env:
          PUSHED: ${{ steps.push.outcome == 'success' }}
        run: |
          {
            echo "pushed=$PUSHED"
            echo "release=$(cat TURTTON_VERSION)"
            echo "cargo=$(readlink -f result-cargo)"
            echo "cargo-deps=$(readlink -f result-deps)"
            echo "attic-client=$(readlink -f result-attic)"
          } >> "$GITHUB_OUTPUT"

  # Fetches what `publish` pushed from attic alone, into an empty store of
  # another location than the one Nix itself runs from: the runner's own store
  # holds only Nix (from cache.nixos.org) and takes no part in the check.
  # `nix copy --from` talks to attic and nothing else, so a path or dependency
  # that attic does not serve fails the job; cache.nixos.org and the flake are
  # never consulted. The negative steps show that a missing path fails.
  verify-cache:
    needs: publish
    if: needs.publish.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: attic-publish
    permissions: {}
    env:
      # The same cache and key as nixConfig in flake.nix.
      ATTIC_URL: https://attic.taile2777.ts.net/home
      ATTIC_HOST: attic.taile2777.ts.net
      ATTIC_KEY: home:00byWMpTTw/3xTntv8EF6LQmlWlR9RU5Tl0GVG5Vwn8=
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Substitute the closures from attic into an empty store
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CARGO_OUT: ${{ needs.publish.outputs.cargo }}
          DEPS_OUT: ${{ needs.publish.outputs.cargo-deps }}
          ATTIC_CLIENT_OUT: ${{ needs.publish.outputs.attic-client }}
        run: |
          store="$RUNNER_TEMP/verify-store"
          roots=("$CARGO_OUT" "$DEPS_OUT" "$ATTIC_CLIENT_OUT")
          for p in "${roots[@]}"; do
            [[ "$p" =~ ^/nix/store/[0-9a-df-np-sv-z]{32}-[A-Za-z0-9+._?=-]+$ ]] \
              || { echo "unexpected store path: $p" >&2; exit 1; }
          done
          # The token is only in this file, read by this job's nix commands.
          (umask 077; printf 'machine %s password %s\n' "$ATTIC_HOST" "$ATTIC_TOKEN" > "$RUNNER_TEMP/netrc")
          mkdir -p "$store"
          nixopts=(--option netrc-file "$RUNNER_TEMP/netrc" --option trusted-public-keys "$ATTIC_KEY" --option substituters "$ATTIC_URL")

          echo "== the verify store starts empty"
          test "$(nix path-info --all --store "local?root=$store" | wc -l)" -eq 0

          echo "== copy the closures from attic only"
          nix copy -L --from "$ATTIC_URL" --to "local?root=$store" "${nixopts[@]}" "${roots[@]}"

          echo "== every path of the closures is there and its content is intact"
          nix path-info --store "local?root=$store" --recursive "${roots[@]}" | tee closure.txt
          wc -l < closure.txt
          while read -r p; do
            test -e "$store$p" || { echo "missing from the verify store: $p" >&2; exit 1; }
          done < closure.txt
          nix store verify --store "local?root=$store" --no-trust --recursive "${roots[@]}"
          # Nothing but those closures was put there.
          test "$(nix path-info --all --store "local?root=$store" | sort | wc -l)" -eq "$(sort -u closure.txt | wc -l)"
      # A check that cannot fail proves nothing. Both paths below are fetched
      # with the same command as above, and both must fail: a path attic never
      # had, and a path that only cache.nixos.org has.
      - name: A path that attic does not serve fails
        run: |
          nixopts=(--option netrc-file "$RUNNER_TEMP/netrc" --option trusted-public-keys "$ATTIC_KEY" --option substituters "$ATTIC_URL")
          fail_to_copy() {
            local store="$RUNNER_TEMP/negative-store-$1"
            mkdir -p "$store"
            if nix copy --from "$ATTIC_URL" --to "local?root=$store" "${nixopts[@]}" "$2"; then
              echo "::error::attic served $2, which it must not have"
              exit 1
            fi
            echo "as expected, attic does not serve $2"
          }
          echo "== a store path with a made-up hash"
          fail_to_copy fake /nix/store/00000000000000000000000000000000-turtton-cargo-missing
          echo "== a path of cache.nixos.org that attic does not have (the Nix of this runner)"
          nix_out="$(readlink -f "$(command -v nix)")"
          nix_out="${nix_out%%/bin/*}"
          nix path-info --store https://cache.nixos.org "$nix_out"
          fail_to_copy nixos "$nix_out"
      - name: Remove the attic credential
        if: always()
        run: rm -f "$RUNNER_TEMP/netrc"
      # chroot, because the store sits under $RUNNER_TEMP while its paths are
      # absolute /nix/store paths; no secret is present from here on.
      - name: Run the substituted package
        env:
          CARGO_OUT: ${{ needs.publish.outputs.cargo }}
          RELEASE: ${{ needs.publish.outputs.release }}
        run: |
          store="$RUNNER_TEMP/verify-store"
          sudo env -i chroot "$store" "$CARGO_OUT/bin/cargo" -V | tee version.txt
          grep -F "turtton/cargo $RELEASE," version.txt
          ! grep -q huacnlee version.txt
